name: Publish container image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  IMAGE_NAME: ${{ github.repository }}
  REGISTRY: ghcr.io

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select build source
        id: build_source
        shell: bash
        run: |
          if [[ "$(git cat-file -t "${GITHUB_REF_NAME}")" == "tag" ]] &&
            git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" | grep -Fxq 'container-build: local'; then
            image="${REGISTRY}/${IMAGE_NAME}"
            version="${GITHUB_REF_NAME#v}"
            version_manifest="$(docker buildx imagetools inspect "${image}:${version}")"
            latest_manifest="$(docker buildx imagetools inspect "${image}:latest")"
            version_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "${version_manifest}")"
            latest_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "${latest_manifest}")"

            grep -qE 'Platform:[[:space:]]+linux/amd64' <<< "${version_manifest}"
            grep -qE 'Platform:[[:space:]]+linux/arm64' <<< "${version_manifest}"

            if [[ -z "${version_digest}" || "${version_digest}" != "${latest_digest}" ]]; then
              echo "The locally published version and latest tags must resolve to the same digest." >&2
              exit 1
            fi

            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Verified the container image published by the local release command."
            exit 0
          fi

          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        if: steps.build_source.outputs.publish == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        if: steps.build_source.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        if: steps.build_source.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}

      - name: Generate image metadata
        id: metadata
        if: steps.build_source.outputs.publish == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          flavor: latest=false
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.description=Server-side Open Graph image generator
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=Nore OG
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push image
        if: steps.build_source.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          pull: true
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
